blind: none
data:
  dir: data
  num_workers: 0
model:
  d_ff: 512
  d_model: 128
  dropout: 0.1
  encoder_channels:
  - 32
  - 64
  - 128
  image_size: 64
  max_letters: 45
  n_heads: 4
  n_layers: 4
  visual_attention: bidirectional
seed: 0
train:
  amp: false
  batch_size: 128
  epochs: 30
  gen_eval_every: 5
  grad_clip: 1.0
  log_every: 25
  lr: 0.001
  warmup_steps: 200
  weight_decay: 0.01
