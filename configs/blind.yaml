# E1 blind-baseline configuration: same model as baseline.yaml, but images
# are replaced by zeros (or shuffled) to test whether the model actually
# uses the image. See Project Brief, section 8 (E1).
#
# ONE variable differs from configs/baseline.yaml: `blind`.  Everything else is identical.
seed: 0
blind: zeros           # zeros: every image -> all-zero tensor (train AND evaluation) | shuffle: random image per word

data:
  dir: data
  num_workers: 0

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 512
  dropout: 0.1
  encoder_channels: [32, 64, 128]
  image_size: 64
  max_letters: 45
  visual_attention: bidirectional

train:
  batch_size: 128
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  amp: false
  log_every: 25
  gen_eval_every: 5
